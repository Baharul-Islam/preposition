function huntQs(n){const pool=['at','on','in','for','by','to','of','from','with'];return sh(HUNT).slice(0,n).map((h,i)=>({id:100+i,h:1,c:'V',s:h[0],w:h[1],a:h[2],r:h[3],b:h[4],o:sh([h[2],...sh(pool.filter(x=>x!=h[2]&&x!=h[1])).slice(0,3)])}))}
function fx(ok){if(!P.snd)return;try{const A=fx.c||(fx.c=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=ok===2?880:ok?660:200;g.gain.value=.08;o.start();o.stop(A.currentTime+(ok?.15:.25))}catch(e){}}
function conf(){if(!P.anim)return;'🎉✨⭐🎊🏆'.match(/./gu).concat('🎉✨⭐🎊🏆'.match(/./gu)).concat('🎉✨⭐🎊'.match(/./gu)).forEach((c,i)=>{const e=document.createElement('i');e.className='cf';e.textContent=c;e.style.left=Math.random()*95+'%';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2600)})}
function setting(){document.body.className=P.anim?'':'noanim'}
function topbar(back,title){return `<div class="top"><button onclick="${back}" aria-label="Back">←</button><span>${title||''}</span><span><button onclick="tg('snd')">${P.snd?'🔊':'🔇'}</button> <button onclick="tg('anim')">${P.anim?'🎞':'⏸'}</button></span></div>`}
function tg(k){P[k]=P[k]?0:1;save();setting();(S&&S.live)?null:cur()}
let cur=home,S=null,T=null;
function go(f){clearInterval(T);cur=f;f();scrollTo(0,0)}

/* ===== SCREENS ===== */
function home(){setting();const L=lvl();app.innerHTML=`${topbar('','Bahar Academy')}
<div class="hero"><div class="brand">BAHAR ACADEMY</div><h1>🎮 PREPOSITION MASTER</h1><p style="margin-top:8px;font-weight:600">Can You Master Every Preposition?</p><small>Play • Practice • Master</small></div>
<p class="mu" style="text-align:center;margin-top:10px">Welcome to Bahar Academy Smart Practice 🎮</p>
<div class="grid"><div class="st"><b>🏆 ${P.best}</b><span>Best Score</span></div><div class="st"><b>🔥 ${P.sb}</b><span>Best Streak</span></div><div class="st"><b>⭐ ${P.xp}</b><span>XP</span></div><div class="st"><b>🎯 ${L}</b><span>${LV[L-1][1]}</span></div></div>
<button class="btn" onclick="go(menu)">▶ START PRACTICE</button>
<button class="btn s" onclick="go(learn)">📚 LEARN RULES</button>
<button class="btn g" onclick="go(board)">🏆 LEADERBOARD</button>
<button class="btn g" onclick="go(prog)">🎖 ACHIEVEMENTS &amp; 📊 MY PROGRESS</button>
<p class="mu" style="text-align:center;margin-top:14px">Grammar বুঝুন, Practice করুন, Result উন্নত করুন।</p>`}
function menu(){const all=[1,2,3,4,5,6].every(k=>(P.done[k]||0)>=60),dd=P.daily==today();
app.innerHTML=`${topbar('go(home)','Choose a game')}
<button class="btn w" onclick="${dd?'':'daily()'}" ${dd?'disabled':''}>⚡ DAILY 10 — 2 min • +500 XP ${dd?'(done today ✓)':''}</button>
<h2>Levels</h2>`+LV.map((v,i)=>{const k=i+1,u=unlocked(k),a=P.done[k];return `<button class="btn g lv" ${u?`onclick="lev(${k})"`:'disabled'}><span class="ic">${u?v[0]:'🔒'}</span><span><b>Level ${k}: ${v[1]}</b><small>${v[2]}${a!=null?' • best '+a+'%':''}</small></span></button>`}).join('')+`
<h2>Modes</h2>
<button class="btn g" onclick="race()">⏱ Preposition Race — 10s per question</button>
<button class="btn g" onclick="hunter()">🔍 Error Hunter</button>
<button class="btn g" onclick="brd()">🇧🇩 Board Exam Mode (Board-Style Practice)</button>
<button class="btn g" onclick="boss()">👹 Boss Battle — 3 lives, 60s</button>
<button class="btn ${all?'s':'g'}" ${all?'onclick="master()"':'disabled'}>${all?'👑':'🔒'} Final Master Challenge</button>`}
function learn(){app.innerHTML=`${topbar('go(home)','📖 Learn before you play')}`+LEARN.map(l=>`<div class="card"><h2>${l[0]}</h2><p>${l[1]}</p><p class="mu" style="margin:6px 0">Example: ${l[2]}</p></div>`).join('')+`<button class="btn" onclick="go(menu)">▶ Practice now</button>`}
function prog(){const L=lvl();app.innerHTML=`${topbar('go(home)','📊 My progress')}
<div class="grid"><div class="st"><b>${P.n}</b><span>Questions answered</span></div><div class="st"><b>${P.g}</b><span>Games played</span></div><div class="st"><b>${P.xp}</b><span>Total XP</span></div><div class="st"><b>${L}</b><span>Player level</span></div></div>
<div class="card"><h2>🎖 Achievements</h2>`+ACH.map(a=>{const on=a[4](P);return `<div class="badge ${on?'':'off'}"><span class="ic">${a[1]}</span><span><b>${a[2]}</b><br><span class="mu">${a[3]}</span></span></div>`}).join('')+`</div>`}
function board(){app.innerHTML=`${topbar('go(home)','🏆 Leaderboard')}
<div class="card"><h2>Your nickname</h2><input id="nk" maxlength="16" placeholder="Nickname (no real name needed)" value="${esc(P.nick)}"><button class="btn" onclick="P.nick=$('#nk').value.trim();save();go(board)">Save nickname</button></div>
<div class="card"><p>🥇 <b>${esc(P.nick||'You')}</b> — ${P.best} best score • ${P.xp} XP</p><p class="mu" style="margin-top:8px">Online ranking needs a server, so this board shows only your own record on this phone for now.</p></div>`}

/* ===== GAME SETUP ===== */
function lev(k){start({name:'Level '+k+': '+LV[k-1][1],qs:pick(QS.filter(q=>q.l==k),8),lvl:k,back:menu})}
function race(){start({name:'⏱ Preposition Race',qs:pick(QS,10),per:10,race:1})}
function hunter(){start({name:'🔍 Error Hunter',qs:huntQs(7)})}
function brd(){start({name:'🇧🇩 Board Exam Mode',qs:pick(QS.filter(q=>q.l>=4),10),board:1,tag:'Board-Style Practice'})}
function boss(){const m=Math.max(1,...[1,2,3,4,5,6].filter(unlocked));start({name:'👹 Preposition Boss',qs:pick(QS.filter(q=>q.l<=m),10),total:60,lives:3,boss:1})}
function daily(){start({name:'⚡ Daily 10',qs:pick(QS,10),total:120,daily:1})}
function master(){start({name:'👑 Preposition Master',qs:pick(QS,50),total:600,master:1,nohint:1})}
function start(c){S={...c,i:0,xp:0,ok:0,st:0,bs:0,cw:0,w:[],cat:{},hl:c.lives||0,t0:Date.now(),live:1};S.back=S.back||menu;q();T=setInterval(tick,250)}
function tick(){if(!S||!S.live)return;const now=Date.now();let tl='';
if(S.total){const l=Math.max(0,S.total-(now-S.t0)/1000);tl=Math.ceil(l)+'s';if(l<=0){finish();return}}
else if(S.per&&!S.done){const l=Math.max(0,S.per-(now-S.qt)/1000);tl=Math.ceil(l)+'s';const b=$('#tb');if(b)b.style.width=l/S.per*100+'%';if(l<=0){ans(null);return}}
const e=$('#tm');if(e)e.textContent=tl?'⏱ '+tl:''}
function q(){const Q=S.qs[S.i];if(!Q||(S.hl&&S.lives<=0&&0)){finish();return}
S.cur=Q;S.done=false;S.ph=Q.h?1:2;S.qt=Date.now();draw()}
function draw(){const Q=S.cur,n=S.qs.length;
let h=`<div class="top"><button onclick="quit()">✕</button><span>${S.name}</span><span id="tm"></span></div>
<div class="top"><span>⭐ ${S.xp}</span><span>🔥 ${S.st}</span>${S.boss?`<span>${'❤️'.repeat(Math.max(0,S.hl))||'💀'}</span>`:''}</div>
${S.boss?`<div class="bar boss"><i style="width:${Math.max(0,100-S.ok*10)}%"></i></div><div class="mu">👹 Boss HP ${Math.max(0,100-S.ok*10)}</div>`:`<div class="bar"><i style="width:${S.i/n*100}%;background:var(--p)"></i></div>`}
${S.per&&!S.total?'<div class="bar"><i id="tb"></i></div>':''}
<div class="card ${S.shake?'sk':''}"><div class="qn">🔥 QUESTION ${String(S.i+1).padStart(2,'0')} / ${n}${S.tag?' • '+S.tag:''}</div>`;
if(!S.nohint&&S.cw>=2)h+=`<div class="hint">💡 Smart Hint: ${HINT[Q.c]||HINT.V}</div>`;
if(Q.c=='T'&&/since|for/.test(Q.o.join()))h+=`<div class="tl"><span>start</span><i></i><span>now</span></div>`;
if(Q.h){h+=S.ph==1?`<div class="sent" style="font-size:18px">Find the mistake! Tap the wrong word:</div><div>${Q.s.replace(/[.]$/,'').split(' ').map(w=>`<button class="wd" onclick="pw('${w}')">${w}</button>`).join('')}</div>`:`<div class="sent">❌ ${Q.s}<br><span style="font-size:16px" class="mu">Replace “${Q.w}” with:</span></div>`}
else h+=`<div class="sent">${Q.s.replace('___','<u>&nbsp;?&nbsp;</u>')}</div>`;
if(S.ph==2)h+=`<div class="ops">${Q.o.map((o,i)=>`<button class="opt" onclick="ans(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;
h+=`<div id="fb"></div></div>`;app.innerHTML=h}
function pw(w){const Q=S.cur;if(w.replace(/[.,]/g,'')==Q.w){S.ph=2;draw()}else{S.done=true;S.pick=w;grade(false,'(wrong word: '+w+')')}}
function ans(i){if(S.done)return;S.done=true;const Q=S.cur,c=i==null?null:Q.o[i];
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(Q.o[j]==Q.a)b.classList.add('c');else if(j==i)b.classList.add('x')});
grade(c==Q.a,c==null?'(time up)':c)}
function grade(ok,yours){const Q=S.cur;let msg='',gain=0;P.recent=[Q.id,...P.recent].slice(0,15);
const ct=S.cat[Q.c]||(S.cat[Q.c]={r:0,t:0});ct.t++;
if(ok){ct.r++;S.ok++;S.st++;S.cw=0;S.bs=Math.max(S.bs,S.st);gain=(Date.now()-S.qt<4000)?150:100;if([5,10,20].includes(S.st)){gain+=250;msg=' 🔥 Perfect streak +250'}
const sm={3:'Nice!',5:'Excellent!',10:'On Fire!',20:'Grammar Master!'}[S.st];if(sm)msg+=` 🔥 ${S.st} Correct — ${sm}`;
if(S.boss)msg+=' 💥 -10 Boss HP';fx(1);if(S.st==3||S.st>=5&&S.st%5==0)conf()}
else{S.st=0;S.cw++;S.shake=1;setTimeout(()=>S.shake=0,400);S.w.push({q:Q,y:yours});if(S.race)gain=-Math.min(20,S.xp);if(S.boss){S.hl--;msg=' ❤️ -1 Life'}fx(0)}
S.xp+=gain;const last=S.i+1>=S.qs.length||(S.boss&&(S.hl<=0||S.ok>=10));
const full=Q.s.replace('___',Q.a).replace(Q.h?' '+Q.w+' ':'§',Q.h?' '+Q.a+' ':'§');
$('#fb').innerHTML=`<div class="fb"><h3 class="${ok?'g':'r'}">${ok?'✅ Correct!':'❌ Incorrect!'} ${gain>0?'+'+gain+' XP':gain<0?gain+' XP':''}${msg}</h3>
${Q.h?`<p>❌ ${Q.s}<br>✅ ${full}</p>`:`<p><b>Correct Answer: ${Q.a}</b></p>`}
<p><b>Rule:</b> ${Q.r}</p><p><b>বাংলা:</b> ${Q.b}</p><p class="mu">Example: ${full}</p>
<button class="btn" onclick="${last?'finish()':'nxt()'}">${last?'See result':'Continue'}</button></div>`;
$('#fb').scrollIntoView({behavior:P.anim?'smooth':'auto',block:'nearest'})}
function nxt(){S.i++;q()}
function quit(){clearInterval(T);S.live=0;go(S.back===menu?menu:home)}
function finish(){if(!S||!S.live)return;S.live=0;clearInterval(T);const tot=Math.min(S.i+(S.done?1:0),S.qs.length)||0,acc=tot?Math.round(S.ok/tot*100):0,sec=Math.round((Date.now()-S.t0)/1000);
P.xp+=S.xp;P.n+=tot;P.g++;P.best=Math.max(P.best,S.xp);P.sb=Math.max(P.sb,S.bs);
if(S.lvl){P.done[S.lvl]=Math.max(P.done[S.lvl]||0,acc);if(!S.w.length&&tot>=5)P.perf=1}
if(S.board&&acc>=90)P.board=1;
let extra='';if(S.daily&&P.daily!=today()){P.daily=today();P.xp+=500;extra='<div class="card"><b>⚡ Daily Challenge Completed! 🎁 +500 XP</b></div>'}
if(S.boss){extra+=S.ok>=10?'<div class="card"><h2>🎉 BOSS DEFEATED!</h2>🏆 Preposition Warrior Badge</div>':'<div class="card"><h2>👹 Boss survived</h2>Review your mistakes and try again.</div>'}
if(S.master&&acc>=90){P.mastered=1;extra+='<div class="cert"><h2>🏆 PREPOSITION MASTER UNLOCKED!</h2><b>“Preposition Master — Bahar Academy”</b><p class="mu">'+esc(P.nick||'Student')+'</p></div>'}
save();if(acc>=70)conf();
const cs=Object.entries(S.cat).map(([k,v])=>[k,v.r/v.t]).sort((a,b)=>b[1]-a[1]);
const strong=cs[0]&&cs[0][1]>=.6?`<p>✅ ${CATN[cs[0][0]]}</p>`:'<p class="mu">Keep playing to find your strength.</p>';
const weak=cs.length&&cs[cs.length-1][1]<1?`<p>⚠ ${CATN[cs[cs.length-1][0]]}</p>`:'<p>🎉 No weak area this time!</p>';
const nextL=S.lvl&&S.lvl<6&&acc>=60;
app.innerHTML=`<div class="hero"><h1>GAME COMPLETE 🎉</h1><p style="font-size:30px;font-weight:800;margin-top:6px">${S.xp} XP</p></div>
<div class="grid"><div class="st"><b>${S.ok}/${tot}</b><span>Correct</span></div><div class="st"><b>${acc}%</b><span>Accuracy</span></div><div class="st"><b>${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}</b><span>Time</span></div><div class="st"><b>🔥 ${S.bs}</b><span>Streak</span></div></div>
${extra}<div class="card"><h2>Your Strength</h2>${strong}<h2>Need More Practice</h2>${weak}</div>
<button class="btn" onclick="replay()">🔄 PLAY AGAIN</button>
${S.w.length?'<button class="btn w" onclick="review()">📖 REVIEW MISTAKES</button>':''}
${nextL?`<button class="btn ok" onclick="lev(${S.lvl+1})">➡ NEXT LEVEL</button>`:''}
<button class="btn g" onclick="go(menu)">Menu</button>`}
function replay(){const c=S;start({...c,qs:c.lvl?pick(QS.filter(x=>x.l==c.lvl),8):c.master?pick(QS,50):c.name.includes('Hunter')?huntQs(7):c.board?pick(QS.filter(x=>x.l>=4),10):pick(QS,10)})}
function review(){const w=S.w;app.innerHTML=`${topbar('finish2()','📖 Mistake review')}`+w.map(m=>`<div class="card"><p class="sent" style="font-size:18px">${m.q.s}</p><p>Your Answer: <b>${esc(m.y)}</b> ❌</p><p>Correct Answer: <b>${m.q.a}</b> ✅</p><p><b>Rule:</b> ${m.q.r}</p><p><b>বাংলা:</b> ${m.q.b}</p></div>`).join('')+`<button class="btn" onclick="retry()">🔁 Try again</button>`}
function finish2(){go(menu)}
function retry(){const qs=S.w.map(m=>m.q.h?m.q:mk(m.q));start({name:'🔁 Retry mistakes',qs,back:menu})}
home();
</script></body></html>
